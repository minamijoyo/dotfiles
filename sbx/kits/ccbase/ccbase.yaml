# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Set env vars
          command: cat ~/scripts/sandbox-persistent.sh >> /etc/sandbox-persistent.sh
          user: "0"
        - description: Set PS1
          # PROMPT_COMMANDのリセット後にdirenv hookを読み直す必要があることに注意
          command: echo 'unset PROMPT_COMMAND; export PS1="[\W@\h]\$ "; . /etc/sandbox-persistent.sh' >> ~/.bashrc
          user: "1000"
        - description: Customize claude settings
          command: cp ~/claude/settings.json ~/.claude/settings.json
          user: "1000"
        - description: mise install (global)
          command: mise install
          user: "1000"
      startup:
        - description: mise install (project)
          command: mise install
          user: "1000"
          background: false
        - description: direnv allow
          command: bash -c 'eval "$(mise activate bash)" && eval "$(direnv hook bash)" && direnv allow'
          user: "1000"
          background: false
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - hosts: [localhost] # aws-vault exec --ecs-server
            methods: [GET]
            paths: [/]
          - claude.com:443
          - downloads.claude.ai:443
          - api.anthropic.com:443
          - platform.claude.com:443
          - github.com:443
          - api.github.com:443
          - ghcr.io:443
          - raw.githubusercontent.com:443
          - release-assets.githubusercontent.com:443
          - pkg-containers.githubusercontent.com:443
          - "*.ap-northeast-1.amazonaws.com:443"
          - "*.ap-northeast-3.amazonaws.com:443"
          - "*.us-east-1.amazonaws.com:443"
          - "*.us-east-2.amazonaws.com:443"
          - "*.s3.ap-northeast-1.amazonaws.com:443"
          - iam.amazonaws.com:443
          - sts.amazonaws.com:443
          - 169.254.169.254:80 # AWS metadata service
          - awscli.amazonaws.com:443
          - docker.io:443
          - auth.docker.io:443
          - registry-1.docker.io:443
          - production.cloudfront.docker.com:443
          - public.ecr.aws:443
          - d5l0dvt14r5h8.cloudfront.net:443 # public.ecr.aws
          - deb.debian.org:80
          - pypi.org:443
          - files.pythonhosted.org:443
          - mise-versions.jdx.dev:443
          - mise.jdx.dev:443
          - tuf-repo-cdn.sigstore.dev:443
