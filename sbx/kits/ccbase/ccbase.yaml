# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - description: Set simple shell prompt
          command: echo 'unset PROMPT_COMMAND; export PS1="[\W@\h]\$ "' >> ~/.bashrc
        - description: Overwrite settings.json
          command: cp ~/claude/settings.json ~/.claude/settings.json
  - type: com.docker.sandbox/network-policy@2
    config:
      runtime:
        allow:
          - claude.com:443
          - downloads.claude.ai:443
          - api.anthropic.com:443
          - platform.claude.com:443
          - github.com:443
          - api.github.com:443
          - raw.githubusercontent.com:443
          - release-assets.githubusercontent.com:443
          - "*.ap-northeast-1.amazonaws.com:443"
          - "*.ap-northeast-3.amazonaws.com:443"
          - "*.us-east-1.amazonaws.com:443"
          - "*.us-east-2.amazonaws.com:443"
          - "*.s3.ap-northeast-1.amazonaws.com:443"
          - ap-northeast-1.signin.aws.amazon.com:443 # aws login --remote
          - iam.amazonaws.com:443
          - sts.amazonaws.com:443
          - 169.254.169.254:80 # AWS metadata service
          - awscli.amazonaws.com:443
          - docker.io:443
          - auth.docker.io:443
          - registry-1.docker.io:443
          - production.cloudfront.docker.com:443
          - public.ecr.aws:443
          - d5l0dvt14r5h8.cloudfront.net:443 # public.ecr.aws
          - deb.debian.org:80
          - pypi.org:443
          - files.pythonhosted.org:443
          - mise-versions.jdx.dev:443
          - mise.jdx.dev:443
          - tuf-repo-cdn.sigstore.dev:443
          - sh.rustup.rs:443
          - static.rust-lang.org:443
          - index.crates.io:443
          - static.crates.io:443
          - npm.flatt.tech:443
          - pypi.flatt.tech:443
          - golang.flatt.tech:443
          - api.osv.dev:443
          - huggingface.co:443
          - us.aws.cdn.hf.co:443
          - cas-server.xethub.hf.co:443
          - download.pytorch.org:443
          - download-r2.pytorch.org:443
          - proxy.golang.org:443
          - releases.hashicorp.com:443
          - checkpoint-api.hashicorp.com:443
          - registry.terraform.io:443
          - registry.opentofu.org:443
